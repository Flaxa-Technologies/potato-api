[package]
name = "potato-api"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "Official Paper-grade Native Rust Plugin API and SDK for PotatoMC Minecraft Server"
repository = "https://github.com/Flaxa-Technologies/potato-api"
homepage = "https://potatomc.flaxa.in/"
documentation = "https://github.com/Flaxa-Technologies/potato-api/tree/main/docs"
readme = "README.md"
keywords = ["minecraft", "server", "plugin", "api", "potatomc"]
categories = ["game-engines", "api-bindings"]

[dependencies]
uuid = { version = "1.10", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive", "std"] }
serde_json = { version = "1.0", features = ["std"] }
serde_yaml = "0.9"
